[package]
name = "harness-bridge"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
description = "Invoke a sibling agent CLI (claude, puku-cli, omp) under a safety contract enforced in the argv shape"
license = "MIT"
publish = false

[lib]
name = "harness_bridge"

[dependencies]
jiff = "0.2.38"
serde_json = "1.0.154"
uuid = { version = "1.29.0", features = ["v4"] }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
