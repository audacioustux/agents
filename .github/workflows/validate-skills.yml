name: Validate skills

on:
  push:
    branches: [main]
    paths:
      - ".agents/skills/**"
      - ".github/scripts/validate-skills.ts"
      - ".github/workflows/validate-skills.yml"
  pull_request:
    paths:
      - ".agents/skills/**"
      - ".github/scripts/validate-skills.ts"
      - ".github/workflows/validate-skills.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Skill corpus gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check skill invariants
        run: deno run --allow-read --allow-net --allow-env --allow-sys .github/scripts/validate-skills.ts
