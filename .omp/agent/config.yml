setupVersion: 1
theme: 
  dark: dark-catppuccin
  light: light-catppuccin
symbolPreset: nerd
statusLine: 
  preset: full
  separator: slash
  transparent: true
  sessionAccent: true
  compactThinkingLevel: false
display: 
  showTokenUsage: false
  shimmer: classic
task: 
  showResolvedModelBadge: true
  enableLsp: true
  maxRecursionDepth: 3
  eager: preferred
  isolation: 
    commits: ai
defaultThinkingLevel: auto
memory: 
  backend: "off"
enabledModels: 
  - omniroute/auto/smart
  - omniroute/pro-chat
  - omniroute/best-chat
  - omniroute/chat
  - omniroute/claude-opus
  - omniroute/claude-sonnet
  - omniroute/pro-coding
  - omniroute/best-coding
  - omniroute/coding
  - omniroute/best-coding-fast
  - omniroute/pro-fast
  - omniroute/best-fast
  - omniroute/fast
  - omniroute/best-free
  - omniroute/pro-reasoning
  - omniroute/best-reasoning
  - omniroute/reasoning
  - omniroute/pro-vision
  - omniroute/best-vision
modelRoles: 
  default: omniroute/best-chat
  smol: omniroute/chat
  slow: omniroute/pro-chat
  plan: omniroute/pro-reasoning
  commit: omniroute/best-fast
  vision: omniroute/best-vision
  designer: omniroute/pro-vision
  task: omniroute/best-coding
  advisor: omniroute/best-reasoning
  tiny: omniroute/fast
retry: 
  enabled: true
  maxRetries: 100
  baseDelayMs: 10000
  modelFallback: true
  fallbackRevertPolicy: cooldown-expiry
  fallbackChains: 
    default: 
      - omniroute/best-reasoning
    smol: 
      - omniroute/best-chat
      - omniroute/best-free
      - omniroute/auto/smart
    slow: 
      - omniroute/pro-reasoning
    plan: 
      - omniroute/pro-chat
    commit: 
      - omniroute/best-coding-fast
      - omniroute/best-free
      - omniroute/auto/smart
    vision: 
      - omniroute/pro-vision
    designer: 
      - omniroute/best-vision
    task: 
      - omniroute/best-chat
    advisor: 
      - omniroute/best-chat
    tiny: 
      - omniroute/best-fast
      - omniroute/best-free
      - omniroute/auto/smart
tui: 
  tight: false
  hyperlinks: auto
  imeSafeCursor: true
advisor: 
  enabled: true
  syncBacklog: "1"
  subagents: false
features: 
  unexpectedStopDetection: true
autolearn: 
  enabled: true
lsp: 
  formatOnWrite: true
  diagnosticsOnEdit: true
inspect_image: 
  enabled: true
checkpoint: 
  enabled: true
github: 
  enabled: true
  cache: 
    enabled: true
secrets: 
  enabled: true
compaction: 
  thresholdPercent: -1
  thresholdTokens: -1
  handoffSaveToDisk: true
  idleEnabled: true
  strategy: context-full
  idleTimeoutSeconds: 1800
  idleThresholdTokens: 400000
terminal: 
  showProgress: true
interruptMode: immediate
branchSummary: 
  enabled: true
bashInterceptor: 
  enabled: false
shellMinimizer: 
  sourceOutlineLevel: default
bash: 
  autoBackground: 
    enabled: false
  enabled: true
todo: 
  eager: preferred
contextPromotion: 
  enabled: false
browser: 
  headless: true
  enabled: true
dev: 
  autoqaConsent: denied
providers: 
  autoThinkingModel: online
personality: default
glob: 
  enabled: true
grep: 
  enabled: true
astEdit: 
  enabled: true
astGrep: 
  enabled: true
