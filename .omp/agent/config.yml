setupVersion: 2
theme: 
  dark: dark-catppuccin
  light: light-catppuccin
symbolPreset: ascii
statusLine: 
  preset: default
  separator: slash
  transparent: true
  sessionAccent: true
  compactThinkingLevel: false
  contextLine: percentage
display: 
  showTokenUsage: false
  shimmer: classic
task: 
  showResolvedModelBadge: true
  enableLsp: true
  maxRecursionDepth: 2
  eager: preferred
  isolation: 
    commits: ai
  maxConcurrency: 4
  enableEffort: true
  maxRuntimeMs: 0
  agentAdvisor: 
    task: "on"
defaultThinkingLevel: auto
memory: 
  backend: mnemopi
enabledModels: 
  - omniroute/auto/smart
  - omniroute/pro-chat
  - omniroute/best-chat
  - omniroute/chat
  - omniroute/claude-opus
  - omniroute/claude-sonnet
  - omniroute/pro-coding
  - omniroute/best-coding
  - omniroute/coding
  - omniroute/best-coding-fast
  - omniroute/pro-fast
  - omniroute/best-fast
  - omniroute/fast
  - omniroute/best-free
  - omniroute/pro-reasoning
  - omniroute/best-reasoning
  - omniroute/reasoning
  - omniroute/pro-vision
  - omniroute/best-vision
modelRoles: 
  default: omniroute/best-chat:xhigh
  smol: omniroute/chat
  slow: omniroute/pro-chat:max
  plan: omniroute/pro-reasoning:max
  commit: omniroute/best-fast:low
  vision: omniroute/best-vision
  designer: omniroute/pro-vision:xhigh
  task: omniroute/best-coding
  advisor: omniroute/best-reasoning
  tiny: omniroute/fast:low
retry: 
  enabled: true
  maxRetries: 100
  baseDelayMs: 10000
  modelFallback: true
  fallbackRevertPolicy: cooldown-expiry
  fallbackChains: 
    default: 
      - omniroute/chat:xhigh
    smol: 
      - omniroute/best-chat:medium
      - omniroute/best-free:xhigh
      - omniroute/auto/smart
    slow: 
      - omniroute/best-chat:max
    plan: 
      - omniroute/pro-chat:max
    commit: 
      - omniroute/best-coding-fast:low
      - omniroute/best-free
      - omniroute/auto/smart
    vision: 
      - omniroute/pro-vision
    designer: 
      - omniroute/best-vision:max
    task: 
      - omniroute/coding:xhigh
    advisor: 
      - omniroute/reasoning:xhigh
    tiny: 
      - omniroute/best-fast:minimal
      - omniroute/best-free:low
      - omniroute/auto/smart
tui: 
  tight: false
  hyperlinks: auto
  imeSafeCursor: true
advisor: 
  enabled: true
  syncBacklog: "1"
features: 
  unexpectedStopDetection: smart
autolearn: 
  enabled: true
  autoContinue: true
lsp: 
  formatOnWrite: true
  diagnosticsOnEdit: true
inspect_image: 
  mode: auto
checkpoint: 
  enabled: true
github: 
  enabled: true
  cache: 
    enabled: true
secrets: 
  enabled: true
compaction: 
  thresholdPercent: 90
  thresholdTokens: -1
  handoffSaveToDisk: true
  idleEnabled: false
  idleTimeoutSeconds: 3600
  idleThresholdTokens: 400000
  methodOrder: 
    - remote
    - snapcompact
    - handoff
    - shake
    - soft
terminal: 
  showProgress: true
interruptMode: immediate
branchSummary: 
  enabled: true
bashInterceptor: 
  enabled: false
shellMinimizer: 
  sourceOutlineLevel: default
bash: 
  autoBackground: 
    enabled: false
  enabled: true
todo: 
  eager: always
contextPromotion: 
  enabled: false
browser: 
  headless: true
  enabled: true
dev: 
  autoqaConsent: denied
providers: 
  autoThinkingModel: online
personality: default
glob: 
  enabled: true
grep: 
  enabled: true
astEdit: 
  enabled: true
astGrep: 
  enabled: true
images: 
  describeForTextModels: true
mnemopi: 
  polyphonicRecall: true
  enhancedRecall: true
  proactiveLinking: true
security: 
  enabled: true
codexResets: 
  autoRedeem: "yes"
error: 
  notify: "on"
composer: 
  shape: claude
