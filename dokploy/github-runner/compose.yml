# Two runner pools on one host. A runner registers to exactly one scope, so
# each pool is its own service; scaling either is its `deploy.replicas`.
#
# Replicas rule out `container_name` and per-replica named volumes, so runner
# registration and /nix both live in the container filesystem:
# - Registration is ephemeral by design: the image self-registers from its
#   access token on start and deregisters on graceful stop (the grace period
#   is what gives that trap time to run), so redeploys do not leak offline
#   duplicates in the runner lists.
# - /nix is warm across jobs for a replica's lifetime and cold only after a
#   redeploy — a shared named volume is not an option, since concurrent
#   replicas would race the nix store's sqlite db.
x-runner: &runner
  image: myoung34/github-runner:ubuntu-noble
  pull_policy: always
  restart: unless-stopped
  stop_grace_period: 60s
  env_file: .env
  # Jobs start sibling containers on the host daemon (socket below) with
  # host-published ports (Tickify's ci.yml: postgres:18 on 5432, redis:8;
  # TheGrid's tests: postgres on 55432). Host networking makes the runner's
  # 127.0.0.1 the same interface those ports publish to; without it every
  # `-p host:container` sibling is unreachable from inside the job. Runners
  # listen on nothing, so replicas cannot conflict.
  network_mode: host
  # Docker's default seccomp profile denies io_uring_* with EPERM (removed
  # from the allowlist in 23.x). TheGrid's runtime is io_uring-based —
  # observed as "failed to open the durable archive: Operation not
  # permitted" in run 33239280012 — and its own Dockerfile documents the
  # requirement. Unconfined seccomp only; no new capabilities granted.
  security_opt:
    - seccomp=unconfined
  # tmpfs rather than the container's overlayfs layer: O_DIRECT opens fail
  # EINVAL on overlayfs, and durable-archive tests create their fixtures
  # under /tmp. Also faster for the ~1600-binary link storms.
  tmpfs:
    - /tmp:exec,size=8g
  volumes:
    # Job service containers and any docker steps run as siblings on the
    # host daemon.
    - /var/run/docker.sock:/var/run/docker.sock
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  runner-tickify:
    <<: *runner
    deploy:
      replicas: 3
    environment:
      RUNNER_SCOPE: repo
      REPO_URL: ${REPO_URL:?}
      RUNNER_NAME_PREFIX: dokploy-tickify
      LABELS: dokploy-tickify
      # Persistent runner (not EPHEMERAL): keeps the workspace and /nix warm
      # across jobs. Safe for these workflows: every checkout uses
      # persist-credentials:false and actions/checkout cleans the tree.
      DISABLE_AUTO_UPDATE: "true"

  runner-thegrid:
    <<: *runner
    # Repo-scoped for now — the shared ACCESS_TOKEN covers it. Converts to
    # an org-scope pool (RUNNER_SCOPE: org, ORG_NAME: nobinalo) once a PAT
    # with admin:org exists; repo-scope registration only needs repo admin.
    deploy:
      replicas: 3
    environment:
      RUNNER_SCOPE: repo
      REPO_URL: https://github.com/nobinalo/TheGrid
      RUNNER_NAME_PREFIX: dokploy-thegrid
      LABELS: dokploy-thegrid
      DISABLE_AUTO_UPDATE: "true"
