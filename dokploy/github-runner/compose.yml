# Four runner services on one host. A runner registers to exactly one scope, so
# each pool is its own service; scaling either is its `deploy.replicas`.
#
# Replicas rule out `container_name` and per-replica named volumes, so runner
# registration and /nix both live in the container filesystem:
# - Registration is ephemeral by design: the image self-registers from its
#   access token on start and deregisters on graceful stop (the grace period
#   is what gives that trap time to run), so redeploys do not leak offline
#   duplicates in the runner lists.
# - /nix is warm across jobs for a replica's lifetime and cold only after a
#   redeploy — a shared named volume is not an option, since concurrent
#   replicas would race the nix store's sqlite db.
#
# Each pool reads the same two variables, prefixed with its name:
# <POOL>_REPO_URL and <POOL>_ACCESS_TOKEN (.env.example).
#
# Each pool is given only its own repo's token, never the whole `.env` (no
# `env_file`). The image un-exports ACCESS_TOKEN before the runner starts,
# but every other variable reaches each job's environment, so a shared env
# file would hand each pool's <POOL>_ACCESS_TOKEN to the other's jobs.
# Dokploy's environment still fills the `${…}` below. A pool's own token
# stays readable by its jobs, which run as root, in PID 1's environment
# (/proc/1/environ); the image's UNSET_CONFIG_VARS would not change that,
# and it drops the token the stop trap deregisters with.
x-runner: &runner
  image: myoung34/github-runner:ubuntu-noble
  pull_policy: always
  restart: unless-stopped
  stop_grace_period: 60s
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  # The big pool: stage-crew/tickify's check (CI's shards and the Dependabot
  # checks), the only jobs that take dokploy-tickify-nonprod, which only this
  # pool carries: no production job and no small workflow can land here
  # (production's runner and the light pool are below).
  runner-tickify-nonprod:
    <<: *runner
    # Jobs start sibling containers on the host daemon (socket below) with
    # host-published ports (Tickify's ci.yml: postgres:18 on 5432, redis:8).
    # Host networking makes the runner's
    # 127.0.0.1 the same interface those ports publish to; without it every
    # `-p host:container` sibling is unreachable from inside the job. Runners
    # listen on nothing, so replicas cannot conflict.
    network_mode: host
    volumes:
      # Job service containers and any docker steps run as siblings on the
      # host daemon.
      - /var/run/docker.sock:/var/run/docker.sock
    # replicas x limits.cpus must not exceed the host's 20 cores. At 3 x 8 (24)
    # three concurrent CI runs slowed each other until units hit their 600 s
    # cap and the 50-minute step cap (stage-crew/tickify run 37960180645: 65 of
    # 66 units passed, then the step timed out). 2 x 10 runs two full checks at
    # once without contention, and the check's CHECK_CONCURRENCY=auto reads the
    # 10-CPU limit (5 units at a time instead of 4). The light and Optics pools
    # below borrow only idle cores, at a small fraction of this pool's weight.
    deploy:
      replicas: 2
      resources:
        reservations:
          cpus: 2
          memory: 16G
        limits:
          cpus: 10
          memory: 16G
    environment:
      RUNNER_SCOPE: repo
      REPO_URL: ${TICKIFY_REPO_URL:?}
      ACCESS_TOKEN: ${TICKIFY_ACCESS_TOKEN:?}
      RUNNER_NAME_PREFIX: dokploy-tickify-nonprod
      LABELS: dokploy-tickify-nonprod
      # Persistent runner (not EPHEMERAL): keeps the workspace and /nix warm
      # across jobs. Safe for these workflows: every checkout uses
      # persist-credentials:false and actions/checkout cleans the tree.
      DISABLE_AUTO_UPDATE: "true"

  # stage-crew/tickify's production jobs (label dokploy-tickify; no
  # environment word, its owner's naming), on a runner no CI job can take:
  # tickify's CI requests dokploy-tickify-nonprod, which this runner lacks, and
  # the CI pool above lacks this label. GitHub has no job priority, and twice
  # on 18 Oct a production deploy sat queued behind CI's two 35-40 minute
  # shards while production was down.
  #
  # Same host, same repo and same token variables as the CI pool, so it is not
  # isolated from CI's jobs (they hold the host's Docker socket and run as
  # root); the owner accepted that on 20 Oct and deferred the isolation.
  runner-tickify:
    <<: *runner
    # 4 CPUs and 8 GB: twice the CPUs of GitHub's hosted runner for a private
    # repo, on which tickify's production apply ran in 13-14 minutes (its runs
    # of 18 Oct). Over-committing the host's 20 cores is allowed (owner,
    # 20 Oct): the limits sum to 4 + 2 x 10 + 2 x 4 + 4 x 2 = 40. Limits are not
    # reservations, and CPU weight is what a busy host divides by: against two
    # CI replicas at the default weight, Optics' two at 64 and the light pool's
    # four at 128, this one is
    # owed 1024 / (3 x 1024 + 2 x 64 + 4 x 128) of 20 cores, about 5.5, above its limit of 4,
    # so CI cannot hold it below its limit.
    # Production's jobs start no containers and need no fixed port, so no
    # Docker socket and no host network.
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: 4
          memory: 8G
    environment:
      RUNNER_SCOPE: repo
      REPO_URL: ${TICKIFY_REPO_URL:?}
      ACCESS_TOKEN: ${TICKIFY_ACCESS_TOKEN:?}
      RUNNER_NAME_PREFIX: dokploy-tickify
      LABELS: dokploy-tickify
      # Without `self-hosted`, `Linux` and `X64`, only a job that names
      # dokploy-tickify lands here.
      NO_DEFAULT_LABELS: "true"
      DISABLE_AUTO_UPDATE: "true"

  # stage-crew/tickify's small workflows (every job that is neither the check
  # nor production's): the security scans, the bucket, Grafana and edge plans,
  # the reuse verdict, and the deploys' gates and `apply`, which wait on a
  # service for up to an hour but use little CPU. Before this pool they shared
  # the big pool's two runners with the check's shards, which then waited 0-2
  # hours a run (1h54m-3h20m a run, 27 Oct).
  #
  # Its label is its own, and the big pool does not carry it: a small job can
  # never take a runner a shard needs, and a job that needs the big pool's
  # Docker socket can never land here. Tickify's workflow test holds the
  # placement; no workflow that asks for this label has a `services:` block, a
  # container or a docker step.
  #
  # No docker socket and no host network, as Optics' pool.
  #
  # CPU: it borrows idle cores, at `cpu_shares: 128` against the big pool's
  # default. Higher than Optics' 64, because a pull request starts its small
  # workflows together with the check, so they mostly run while the big pool is
  # busy, and tickify's Semgrep alone measured 507 CPU-seconds, 5 min 24 s at
  # 169% CPU (security.yml).
  # Computed, not measured on this host, for the big pool and these four busy:
  # these get about 4.0 cores in all on cgroup v1 (512 of 2560 shares); on v2,
  # 1.8 where runc maps 128 shares to weight 5 and 5.9 where it maps them to 21
  # (the two mappings Optics' note gives). The big pool keeps 76% of the host
  # on v1 and 88% or 65% on v2 while these and Optics are busy: these jobs are
  # bursts, but a shard already runs near its bound. If the big pool's units
  # time out while these are busy, lower the weight; if these jobs time out,
  # raise it.
  #
  # 4 replicas: a pull request starts about seven small jobs at once, and a
  # deploy's gate and `apply` each hold one for up to an hour. Unmeasured: a
  # replica starts with an empty /nix, so its first nix job after a redeploy
  # pays a cold install, and Semgrep's memory in 6 GB (README, "Watching the
  # first runs", which also says what to read for the queue and the weight).
  runner-tickify-light:
    <<: *runner
    cpu_shares: 128
    deploy:
      replicas: 4
      resources:
        reservations:
          memory: 1G
        limits:
          cpus: 2
          memory: 6G
    environment:
      RUNNER_SCOPE: repo
      REPO_URL: ${TICKIFY_REPO_URL:?}
      ACCESS_TOKEN: ${TICKIFY_ACCESS_TOKEN:?}
      RUNNER_NAME_PREFIX: dokploy-tickify-light
      LABELS: dokploy-tickify-light
      # Without `self-hosted`, `Linux` and `X64`, only a job that names
      # dokploy-tickify-light lands here, as production's runner.
      NO_DEFAULT_LABELS: "true"
      # Persistent, as the big pool's.
      DISABLE_AUTO_UPDATE: "true"

  runner-optics:
    <<: *runner
    # nobinalo/Optics' check.yml runs two jobs side by side, one per replica:
    # the static gates (~1.5 min) and the browser gates (~9 min: Playwright's
    # Chromium, then e2e, SSR and the render audit). Neither starts a
    # container or needs a fixed port, so this pool has no docker socket and
    # no host network: on the stack's own network, the servers its tests
    # open on free ports stay off the host's interfaces. Playwright runs
    # Chromium without its sandbox and off /dev/shm by default, as a root
    # container needs, and `playwright install --with-deps` apt-installs as
    # root (the packages once per replica; `apt-get update` every job).
    #
    # CPU: tickify's pool already holds all 20 cores (above), and slows when
    # it gets less. This pool takes idle cores: `cpu_shares: 64` against
    # tickify's default. How that splits a fully busy host depends on its
    # cgroup version and runc: cgroup v1, 128/2176 to Optics (~1.2 cores of
    # 20); cgroup v2, weight 3 or 12 per replica against tickify's 100 (~0.6
    # or ~2.1 cores). Tickify keeps 89-97% either way. If Optics' jobs time
    # out while tickify is busy, raise this weight, at tickify's expense.
    cpu_shares: 64
    deploy:
      replicas: 2
      resources:
        reservations:
          memory: 2G
        limits:
          cpus: 4
          memory: 8G
    environment:
      RUNNER_SCOPE: repo
      REPO_URL: ${OPTICS_REPO_URL:?}
      ACCESS_TOKEN: ${OPTICS_ACCESS_TOKEN:?}
      RUNNER_NAME_PREFIX: dokploy-optics
      LABELS: dokploy-optics
      # Persistent, as tickify's. Optics' checkout keeps the default
      # persist-credentials, but that is the job's own GITHUB_TOKEN: its post
      # step removes it, and it expires when the job ends.
      DISABLE_AUTO_UPDATE: "true"
