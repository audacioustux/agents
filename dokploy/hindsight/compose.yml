services:
  hindsight:
    container_name: hindsight
    image: ghcr.io/vectorize-io/hindsight:latest
    pull_policy: always
    restart: unless-stopped
    stop_grace_period: 40s
    env_file: .env
    volumes:
      - hindsight-data:/home/hindsight/.pg0
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8888/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      # Embedded pg0 bootstraps + local embedding models load on first boot.
      start_period: 300s
    networks:
      - dokploy-network
    ports:
      - ${PORT:?}
      - ${CONTROL_PLANE_PORT:?}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
 
networks:
  dokploy-network:
    external: true
 
volumes:
  hindsight-data: