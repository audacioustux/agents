services:
  puku-proxy:
    container_name: puku-proxy
    build:
      # Build context is the puku-proxy source repo (audacioustux/puku-proxy).
      # The Dockerfile lives at the root of that repo and is the single source
      # of truth for the image; this compose file only wires deploy-time config.
      context: https://github.com/audacioustux/puku-proxy.git
      dockerfile: Dockerfile
      # NOTE: Dokploy's BuildKit layer cache is NOT cleared by the UI's
      # "Clear Build Cache" button — that only purges dangling images. If a
      # build replays a stale failed layer (e.g. after changing the runtime
      # base image), bump the CACHEBUST value here (or in the proxy repo's
      # Dockerfile default) to force a fresh build of the runtime stage.
      args:
        - CACHEBUST=deploy-2026-09-22T15-05Z
    pull_policy: always
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: .env
    networks:
      - dokploy-network
    ports:
      - ${PORT:-8787}:8787
    healthcheck:
      # curl isn't in the slim Bun image, so use bun's built-in fetch.
      test:
        - CMD-SHELL
        - "bun -e 'fetch(`http://127.0.0.1:${PORT:-8787}/healthz`).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        reservations:
          cpus: "0.5"
          memory: 512M
        limits:
          cpus: "1"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  dokploy-network:
    external: true