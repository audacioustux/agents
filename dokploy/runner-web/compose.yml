services:
  redis:
    image: redis:8.6.2-alpine
    container_name: omniroute-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    command: redis-server --save 60 1 --loglevel warning
    deploy:
      resources:
        reservations:
          memory: 256M
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
        
  omniroute:
    container_name: omniroute
    depends_on:
      redis:
        condition: service_healthy
    # `:next` tracks the active `release/v*` branch and is the freshest
    # published plain tag — newer than `:main`, and four weeks ahead of
    # `:latest`, which only moves on a SemVer publish. Non-`-web` tags are
    # built from the `runner-base` stage; the `-web` variants add Playwright
    # and Chromium for web-session providers we don't use.
    #
    # Building from source would track the branch exactly, but costs a ~6GB
    # Turbopack compile on every deploy for a few days' freshness. Not worth
    # it here.
    image: diegosouzapw/omniroute:next
    pull_policy: always
    restart: unless-stopped
    stop_grace_period: 40s
    deploy:
      resources:
        reservations:
          cpus: 1
          memory: 16G
        limits:
          cpus: 4
          memory: 16G
    env_file: .env
    volumes:
      - omniroute-data:/app/data
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - dokploy-network
    ports:
      - ${PORT:?}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"


networks:
  dokploy-network:
    external: true

volumes:
  omniroute-data:
  redis-data:
