services:
  redis:
    image: redis:8.6.2-alpine
    container_name: omniroute-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    command: redis-server --save 60 1 --loglevel warning
    deploy:
      resources:
        reservations:
          memory: 256M
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
        
  omniroute:
    container_name: omniroute
    depends_on:
      redis:
        condition: service_healthy
    # Built from source rather than a published tag: the Docker Hub tags lag
    # main by days (main-web was 3 days behind at the time of writing), and we
    # want current code.
    #
    # `target: runner-base` is the plain image — the same stage the published
    # `:main` tag is built from (see the upstream docker-publish.yml). Omitting
    # it would default to the Dockerfile's last stage, `runner-cli`, which adds
    # codex/claude-code/droid/openclaw and docker.io. `runner-web` is the other
    # variant, adding Playwright + Chromium; we don't use the web-session
    # providers, so we skip that cost.
    #
    # Bump CACHEBUST to force BuildKit to refetch the source repo — without it
    # a cached clone of an older commit can be replayed indefinitely.
    build:
      context: https://github.com/diegosouzapw/OmniRoute.git#main
      dockerfile: Dockerfile
      target: runner-base
      args:
        - CACHEBUST=build-2026-09-24T11-40Z
        - OMNIROUTE_BUILD_MEMORY_MB=6144
    pull_policy: build
    restart: unless-stopped
    stop_grace_period: 40s
    deploy:
      resources:
        reservations:
          cpus: 1
          memory: 16G
        limits:
          cpus: 4
          memory: 16G
    env_file: .env
    volumes:
      - omniroute-data:/app/data
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - dokploy-network
    ports:
      - ${PORT:?}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"


networks:
  dokploy-network:
    external: true

volumes:
  omniroute-data:
  redis-data:
