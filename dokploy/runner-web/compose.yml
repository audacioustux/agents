services:
  redis:
    image: redis:8.6.2-alpine
    container_name: omniroute-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    command: redis-server --save 60 1 --loglevel warning
    deploy:
      resources:
        reservations:
          memory: 256M
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
        
  qdrant:
    image: "qdrant/qdrant:latest"
    environment:
      - SERVICE_FQDN_QDRANT_6333
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY}
    expose:
      - "6333"
    volumes:
      - "qdrant_data:/qdrant/storage"
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1
      interval: 5s
      timeout: 5s
      retries: 3
      
  omniroute:
    container_name: omniroute
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    image: diegosouzapw/omniroute:latest-web
    pull_policy: always
    restart: unless-stopped
    stop_grace_period: 40s
    env_file: .env
    volumes:
      - omniroute-data:/app/data
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - dokploy-network
    ports:
      - ${PORT:?}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"


networks:
  dokploy-network:
    external: true

volumes:
  omniroute-data:
  redis-data:
  qdrant_data:
